plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+mc.${minecraft_version}-fabric"
group = mod_group
base { archivesName = mod_id }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

// Datagen classes that runtime registration calls into (their datagen lambdas compile against port stubs).
def KEPT_DATAGEN = ['rbasamoyai/createbigcannons/datagen/CBCCommonMetal.java',
                    'rbasamoyai/createbigcannons/datagen/assets/CBCBuilderTransformers.java']

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        java {
            // Datagen is stubbed for now (committed src/generated/resources are used as-is); see PORTING-26.1.md.
            exclude { el -> !el.directory && el.path.startsWith('rbasamoyai/createbigcannons/datagen/') && !(el.path in KEPT_DATAGEN) }
            // Compat for mods with no 26.1 Fabric build yet.
            exclude 'rbasamoyai/createbigcannons/compat/copycats/**'
            exclude 'rbasamoyai/createbigcannons/compat/framedblocks/**'
            exclude 'rbasamoyai/createbigcannons/mixin/compat/framedblocks/**'
            exclude 'rbasamoyai/createbigcannons/compat/curios/**'
            // JEI compat is built on Create's JEI helpers, which Create Fly organises differently; ported later.
            exclude 'rbasamoyai/createbigcannons/compat/jei/**'
            exclude 'rbasamoyai/createbigcannons/compat/common_jei/**'
        }
    }
}

def aeronauticsJar = { String module, String name ->
    file("${aeronautics_dir}/${module}/build/libs/${name}")
}

dependencies {
    // 26.1 is unobfuscated: no mappings, and Loom no longer remaps (non-remap "fabric-loom" plugin).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    implementation files(create_fly_jar)

    // Used by the relocated Registrate port (rbasamoyai.createbigcannons.port.registrate)
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"

    // Ritchie's Projectile Library: our 26.1 Fabric build, nested in the CBC jar.
    implementation files(rpl_jar)
    include files(rpl_jar)

    // Optional compat
    compileOnly "maven.modrinth:jei:${jei_version}"
    compileOnly files(
            aeronauticsJar('sable', "sable-fabric-${minecraft_version}-2.0.3-fabric.26.1.2-port.jar"),
            aeronauticsJar('simulated', "simulated-fabric-${minecraft_version}-1.3.0.jar"),
            aeronauticsJar('aeronautics', "aeronautics-fabric-${minecraft_version}-1.3.0.jar"),
            aeronauticsJar('offroad', "offroad-fabric-${minecraft_version}-1.3.0.jar"))
}

processResources {
    def props = [
            version                   : project.version,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_author                : mod_author,
            mod_license               : mod_license,
            description               : project.description ?: description,
            mod_sources               : mod_sources,
            mod_issues                : mod_issues,
            minecraft_version         : minecraft_version,
            fabric_loader_version     : fabric_loader_version,
            fabric_api_version        : fabric_version,
            forgeconfigapiport_version: forgeconfigapiport_version,
            create_fly_version_range  : create_fly_version_range
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand props }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

jar {
    from('LICENSE.md') { rename { "LICENSE_${mod_id}.md" } }
    from('LICENSE-MIT.md') { rename { "LICENSE-MIT_${mod_id}.md" } }
    from('LICENSE-CCBYNCSA.md') { rename { "LICENSE-CCBYNCSA_${mod_id}.md" } }
}
